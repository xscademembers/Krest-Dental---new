      - generic [ref=e74]:
        - heading "What are dental implants?" [level=2] [ref=e75]
        - paragraph [ref=e76]: Dental implants are small medical-grade titanium posts placed in the jawbone to support artificial teeth. They function like tooth roots and can hold crowns, bridges, or full-arch restorations securely.
        - paragraph [ref=e77]: They are ideal for people with missing teeth, severely broken teeth, or patients using removable dentures who want stronger comfort, confidence, and function.
      - img "Advanced dental clinic setup for dental implant procedure" [ref=e79]
    - generic [ref=e80]:
      - heading "Why choose dental implants over other tooth replacement options?" [level=2] [ref=e81]
      - paragraph [ref=e82]: If you are comparing tooth replacement options, implants are often considered the gold standard for stability and long-term value. Unlike removable dentures, implants are fixed. Unlike many conventional bridge plans, implants can reduce dependency on adjacent teeth and help preserve jawbone support.
