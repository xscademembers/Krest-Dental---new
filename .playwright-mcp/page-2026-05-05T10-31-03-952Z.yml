        - listitem [ref=e148]: Bone quality and supportive procedures if required
        - listitem [ref=e149]: Implant system and material selection
        - listitem [ref=e150]: Technology and planning complexity for your case
        - listitem [ref=e151]: Esthetic and bite refinement needs
    - generic [ref=e152]:
      - 'heading "Before and after: what changes can you expect?" [level=2] [ref=e153]'
      - paragraph [ref=e154]: Before treatment, patients often report smile gaps, chewing difficulty, and reduced confidence in social situations. After successful implant treatment, most patients experience improved bite strength, better comfort, and a naturally restored smile profile.
      - paragraph [ref=e155]: "Outcomes vary by individual anatomy and treatment goals, but the objective is consistent: restore function, preserve oral health, and rebuild confidence with a stable long-term solution."
