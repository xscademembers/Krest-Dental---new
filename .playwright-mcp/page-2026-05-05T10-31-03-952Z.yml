    - generic [ref=e171]:
      - heading "Looking for dental implants in [City]?" [level=2] [ref=e172]
      - paragraph [ref=e173]: If you are searching for dental implants in [City], our clinic offers consultation-led care with modern diagnostics and patient-friendly planning. You receive a clear roadmap, realistic timeline, and treatment options suited to your oral health and long-term goals.
    - generic [ref=e174]:
      - heading "Frequently Asked Questions" [level=2] [ref=e175]
      - generic [ref=e176]:
        - article [ref=e177]:
          - heading "Is dental implant surgery painful?" [level=3] [ref=e178]
          - paragraph [ref=e179]: Most patients describe dental implant treatment as comfortable. The procedure is performed under local anesthesia, so you should not feel sharp pain during surgery. Mild soreness afterward is normal and usually controlled with medication and aftercare guidance.
        - article [ref=e180]:
          - heading "How long do dental implants last?" [level=3] [ref=e181]
          - paragraph [ref=e182]: Dental implants are built as a long-term solution. With healthy gums, proper cleaning, and regular dental reviews, they can last for many years and often decades. The visible crown may need maintenance over time, but the implant base is highly durable.
        - article [ref=e183]:
          - heading "Are dental implants safe?" [level=3] [ref=e184]
          - paragraph [ref=e185]: Yes, implants are a proven and widely used treatment in modern dentistry. Safety is improved with proper diagnosis, digital planning, and strict sterilization protocols. A complete consultation helps us identify the safest approach for your specific case.
        - article [ref=e186]:
          - heading "What is the recovery time after implant surgery?" [level=3] [ref=e187]
          - paragraph [ref=e188]: Most patients return to routine non-strenuous activities in one to two days. Gum tenderness usually settles in a few days, while full bone integration takes longer depending on the case. We monitor healing carefully before final tooth placement.
        - article [ref=e189]:
          - heading "Can anyone get dental implants?" [level=3] [ref=e190]
          - paragraph [ref=e191]: Many adults are eligible, including patients missing one, several, or all teeth. Bone support, gum health, and medical history are assessed before treatment. Even when bone is reduced, advanced planning may still make implants possible.
        - article [ref=e192]:
          - heading "Are implants better than dentures?" [level=3] [ref=e193]
          - paragraph [ref=e194]: Implants are fixed and generally feel closer to natural teeth, especially while eating and speaking. Dentures can still be suitable for some patients, but they may feel less stable. The best choice depends on your oral condition and goals.
        - article [ref=e195]:
          - heading "How long does the procedure take?" [level=3] [ref=e196]
          - paragraph [ref=e197]: The timeline depends on the treatment type - single implant, multiple implants, or full-mouth rehabilitation. Some cases move faster, while others need staged healing. During consultation, you receive a clear, personalized timeline.
        - article [ref=e198]:
          - heading "What is the success rate of dental implants?" [level=3] [ref=e199]
          - paragraph [ref=e200]: Dental implants have a high long-term success rate when diagnosis, technique, and aftercare are done properly. Success depends on hygiene, gum health, and regular check-ups. We provide detailed post-treatment instructions to protect outcomes.
        - article [ref=e201]:
          - heading "Are implants permanent teeth replacement?" [level=3] [ref=e202]
          - paragraph [ref=e203]: Dental implants are considered the closest option to permanent teeth replacement currently available. They are anchored in the jawbone and designed for long-term function. Good maintenance is essential to keep them healthy and stable.
        - article [ref=e204]:
          - heading "What can I eat after implant surgery?" [level=3] [ref=e205]
          - paragraph [ref=e206]: In the early healing phase, soft and non-spicy foods are usually recommended. Avoid very hard, sticky, or very hot foods until your dentist confirms healing progress. A guided food plan can make recovery smoother and safer.
