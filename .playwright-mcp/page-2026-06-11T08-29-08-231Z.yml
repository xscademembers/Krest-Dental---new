                  - heading "Why Orthodontics?" [level=2] [ref=e178]
                  - paragraph [ref=e180]: Orthodontic treatment isn’t just about aesthetics — it’s about creating a healthy bite, boosting your self-confidence, and protecting your long-term oral health. Whether you’re addressing gaps, crowding, or bite issues, orthodontics ensures your smile looks great and functions perfectly.
                  - button "Book Appointment" [ref=e182] [cursor=pointer]:
