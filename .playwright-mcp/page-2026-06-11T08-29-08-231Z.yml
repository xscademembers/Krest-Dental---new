                        - heading "Braces & Invisalign" [level=3] [ref=e199]
                        - paragraph [ref=e201]: We offer both traditional metal braces and Invisalign clear aligners to effectively straighten teeth. Each treatment plan is fully customized to meet your smile goals with maximum comfort and precision.
                    - listitem [ref=e202]:
                      - generic [ref=e204]:
                        - heading "Clear Aligners" [level=3] [ref=e207]
                        - paragraph [ref=e209]: Nearly invisible and removable, clear aligners are ideal for those seeking a discreet, flexible solution to correct alignment without metal brackets or wires.
                    - listitem [ref=e210]:
                      - generic [ref=e212]:
                        - heading "Pediatric Orthodontics" [level=3] [ref=e215]
                        - paragraph [ref=e217]: Early orthodontic care helps guide proper jaw and tooth development, preventing future dental issues. We provide gentle, effective treatments tailored for children.
                    - listitem [ref=e218]:
                      - generic [ref=e220]:
                        - heading "Cosmetic Smile Alignment" [level=3] [ref=e223]
                        - paragraph [ref=e225]: For adults with mild crowding or spacing, our aesthetic alignment treatments deliver a confident, beautiful smile — often without the need for full braces.
