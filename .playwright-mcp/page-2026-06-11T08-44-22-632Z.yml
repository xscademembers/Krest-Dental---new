        - heading "Why Orthodontics?" [level=2] [ref=e93]
        - paragraph [ref=e94]: Orthodontic treatment isn’t just about aesthetics — it’s about creating a healthy bite, boosting your self-confidence, and protecting your long-term oral health. Whether you’re addressing gaps, crowding, or bite issues, orthodontics ensures your smile looks great and functions perfectly.
        - link "Book Appointment" [ref=e95] [cursor=pointer]:
          - /url: /contact
          - generic [ref=e96]: Book Appointment
          - img [ref=e97]
      - generic [ref=e100]:
        - article [ref=e101]:
          - heading "Braces & Invisalign" [level=3] [ref=e102]
          - paragraph [ref=e103]: We offer both traditional metal braces and Invisalign clear aligners to effectively straighten teeth. Each treatment plan is fully customized to meet your smile goals with maximum comfort and precision.
        - article [ref=e104]:
          - heading "Clear Aligners" [level=3] [ref=e105]
          - paragraph [ref=e106]: Nearly invisible and removable, clear aligners are ideal for those seeking a discreet, flexible solution to correct alignment without metal brackets or wires.
        - article [ref=e107]:
          - heading "Pediatric Orthodontics" [level=3] [ref=e108]
          - paragraph [ref=e109]: Early orthodontic care helps guide proper jaw and tooth development, preventing future dental issues. We provide gentle, effective treatments tailored for children.
        - article [ref=e110]:
          - heading "Cosmetic Smile Alignment" [level=3] [ref=e111]
          - paragraph [ref=e112]: For adults with mild crowding or spacing, our aesthetic alignment treatments deliver a confident, beautiful smile — often without the need for full braces.
    - generic [ref=e114]:
      - generic [ref=e115]:
        - heading "Why Choose Invisalign?" [level=2] [ref=e116]
        - paragraph [ref=e117]: "Invisalign has completely transformed orthodontic care, offering a smarter, more comfortable alternative to braces. Here’s why it’s the preferred choice for teens and adults:"
