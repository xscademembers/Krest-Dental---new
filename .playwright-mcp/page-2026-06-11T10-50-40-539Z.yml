          - 'heading "Implants vs. bridges: how to choose what is right for you" [level=1] [ref=e80]'
          - paragraph [ref=e81]: Both restore missing teeth, but they age differently and demand different long-term care. Here is how we help patients decide.
          - generic [ref=e82]:
            - img "Dr. Suneeta Veeramachaneni" [ref=e83]
            - generic [ref=e84]:
              - paragraph [ref=e85]: Dr. Suneeta Veeramachaneni
              - paragraph [ref=e86]: 2 August 2025 · 5 min read
        - img "Krest Dental — implants overview" [ref=e89]
        - generic [ref=e91]:
          - paragraph [ref=e92]: When a tooth is lost, two of the most common replacement options are a dental implant and a fixed bridge. Both restore function and aesthetics, but they take different paths to get there.
          - generic [ref=e93]:
            - heading "How an implant works" [level=2] [ref=e94]: How an implant works
            - paragraph [ref=e96]: An implant replaces the root with a titanium post anchored in the jaw, then a custom crown is placed on top. Because the post stimulates the bone, the surrounding ridge stays healthier over time. The neighbouring teeth are left untouched.
          - figure "Dr. Suneeta Veeramachaneni" [ref=e97]:
            - blockquote [ref=e98]: “Because the post stimulates the bone, the surrounding ridge stays healthier over time.”
            - generic [ref=e99]: Dr. Suneeta Veeramachaneni
          - generic [ref=e100]:
            - heading "How a bridge works" [level=2] [ref=e101]: How a bridge works
            - paragraph [ref=e103]: A bridge instead uses the two adjacent teeth as anchors. The middle tooth is suspended between them. It is a faster, lower-cost path that suits patients who want to avoid surgery, and it can look excellent in skilled hands. The trade-off is that the anchor teeth need to be reshaped, and the bone underneath the missing tooth slowly resorbs.
          - generic [ref=e104]:
            - heading "How we decide together" [level=2] [ref=e105]: How we decide together
            - paragraph [ref=e107]: We usually recommend implants when the neighbouring teeth are healthy, when bone volume is good, and when the patient wants the most long-lasting solution. Bridges remain a strong option when the adjacent teeth already need crowns, or when surgery is not preferred.
          - complementary "Key takeaways" [ref=e108]:
            - heading "Key takeaways" [level=2] [ref=e109]
            - list [ref=e110]:
              - listitem [ref=e111]: Implants preserve bone and leave neighbouring teeth untouched.
              - listitem [ref=e113]: Bridges are faster and avoid surgery, but anchor teeth must be reshaped.
              - listitem [ref=e115]: Healthy adjacent teeth and good bone volume favour an implant.
              - listitem [ref=e117]: If the adjacent teeth already need crowns, a bridge can be the smarter path.
