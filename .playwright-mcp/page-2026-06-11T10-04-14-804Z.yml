          - heading "Single Tooth Replacement" [level=3] [ref=e102]
          - paragraph [ref=e103]: Replace one missing tooth with a single implant and a custom-made crown designed to match your natural teeth perfectly.
        - article [ref=e104]:
          - heading "Multi Teeth Replacement" [level=3] [ref=e105]
          - paragraph [ref=e106]: Bridge larger gaps using two or more implants to support a fixed bridge — stronger, more stable, and longer-lasting than traditional options.
        - article [ref=e107]:
          - heading "Full Arch Restoration" [level=3] [ref=e108]
          - paragraph [ref=e109]: Restore an entire upper or lower arch with implant-supported dentures, eliminating slipping or adhesives and bringing back full confidence.
        - article [ref=e110]:
          - heading "Bone Grafting & Sinus Lifts" [level=3] [ref=e111]
          - paragraph [ref=e112]: Advanced bone augmentation techniques allow us to rebuild insufficient bone volume, creating a strong foundation for implant success even in complex cases.
